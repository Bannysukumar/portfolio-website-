<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0b0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="author" content="Adepu Sukumar" />

    <!--
      Google Search Console ownership check. Deliberately placed OUTSIDE the
      seo:start/end block and without a data-seo attribute: the prerenderer
      replaces only what is inside the markers, and the client-side useSeo hook
      only removes tags it owns (data-seo), so this tag survives on every page
      and on every in-app navigation. Do not remove it — verification lapses.
    -->
    <meta name="google-site-verification" content="19aqihOrD-qf3lECIogsri3a8H8WCd2piEQ7xdq2Akg" />

    <!--
      Route-specific SEO tags. The block below is the homepage default used by
      the dev server; `npm run build` replaces everything between the markers
      with the correct tags for each prerendered route.
    -->
    <!--seo:start-->
    <title>Adepu Sukumar | Freelance Software Developer in South India</title>
    <meta
      name="description"
      content="Adepu Sukumar is a freelance software developer building websites and web applications for clients across Telangana, Andhra Pradesh and Tamil Nadu. Custom projects start at ₹20,000."
    />
    <link rel="canonical" href="https://adepu-sukumar.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adepu Sukumar" />
    <meta property="og:title" content="Adepu Sukumar | Freelance Software Developer in South India" />
    <meta
      property="og:description"
      content="Adepu Sukumar is a freelance software developer building websites and web applications for clients across Telangana, Andhra Pradesh and Tamil Nadu. Custom projects start at ₹20,000."
    />
    <meta property="og:url" content="https://adepu-sukumar.vercel.app/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://adepu-sukumar.vercel.app/og.png" />
    <meta property="og:image:width" content="1140" />
    <meta property="og:image:height" content="838" />
    <meta property="og:image:alt" content="Adepu Sukumar — independent freelance software developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adepu Sukumar | Freelance Software Developer in South India" />
    <meta
      name="twitter:description"
      content="Freelance software developer building websites and web applications for clients across South India."
    />
    <meta name="twitter:image" content="https://adepu-sukumar.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="Adepu Sukumar — independent freelance software developer" />
    <!--seo:end-->
  </head>
  <body>

      <style>
        .reveal {
          opacity: 1;

    <script type="module" src="/src/main.tsx"></script>
